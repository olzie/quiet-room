<style>
/* Игровой экран: шапка-индикатор, сцена на всю высоту, панель предметов снизу. Спальня светлым карандашом по глубокой ночи. Намеренно только тёмная тема. */
:root{
  color-scheme: dark;
  --night:#120f22;
  --wall:#1d1934;
  --wall-l:#191530;
  --floor:#16122a;
  --rug:#221c40;
  --sky:#0c1530;
  --curtain:#2b2452;
  --headboard:#2a2350;
  --table:#2d2650;
  --blanket:#3c3470;
  --blanket2:#4a4186;
  --pillow:#5a5280;
  --ink:#cfc6e6;
  --ink-soft:#8a82ad;
  --lamp:#f0b46a;
  --cat:#c9875c;
  --cat-dark:#8f5a3a;
  --cat-ink:#4a2c1c;
  --cat-belly:#e2b48f;
  --hat:#2f2860;
  --hat-line:#6a5fb0;
  --hat-edge:#cfc6e6;
  --blossom:#e6a9c0;
  --firefly:#f6e3a1;
  --moon:#e9e1c4;
  --text:#e6e0f2;
  --muted:#9890b6;
  --line:#352f57;
  --panel:#1b1731;
  --display:"Comfortaa", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.game{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:8px 10px;box-sizing:border-box}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.title{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.hud-r{display:flex;align-items:center;gap:8px}
.meter:has(#lightText[hidden]){padding:0 5px}
.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud-r{flex:none}
@media (max-width:380px){.title{font-size:.95rem}.hud-r{gap:6px}.meter{gap:5px;padding-right:9px;font-size:.74rem}}
.meter{font:inherit;cursor:pointer;transition:border-color .6s,box-shadow .6s;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.meter svg{width:24px;height:24px}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);cursor:pointer;padding:0}
.round svg{width:20px;height:20px}
.lang{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.04em;color:var(--ink)}
.hud-r{position:relative}
.soundmenu{position:absolute;top:44px;right:0;z-index:30;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:1.5px solid var(--ink-soft);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:170px}
.soundmenu button{display:flex;align-items:center;gap:10px;font:inherit;font-size:.88rem;color:var(--text);background:transparent;border:0;border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left}
.soundmenu button svg{width:20px;height:20px;flex:none;color:var(--ink-soft)}
.soundmenu button:hover{background:var(--wall)}
.soundmenu button[aria-checked="true"]{background:var(--wall);color:var(--lamp)}
.soundmenu button[aria-checked="true"] svg{color:var(--lamp)}
.soundmenu button:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.round.on{color:var(--lamp);border-color:var(--lamp)}
.meter.full{border-color:var(--firefly);animation:mglow 3.2s ease-in-out infinite}
@keyframes mglow{50%{box-shadow:0 0 14px rgba(246,227,161,.35)}}
.meter:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.round[aria-pressed="true"]{color:var(--lamp);border-color:var(--lamp)}
.stage{flex:1;min-height:0;position:relative}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
/* при запуске комната перестраивается под заставкой, пока размер экрана не устоится; растворяется только заставка */
.caption{min-height:calc(2 * 1.45em + 17px);display:flex;align-items:center;justify-content:center;line-height:1.45;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;width:100%;max-width:400px;box-sizing:border-box;text-align:center;background:rgba(18,15,34,.78);border:1.5px solid var(--line);border-radius:16px;padding:7px 14px;font-size:.85rem;color:var(--text);pointer-events:none;transition:opacity .6s;text-wrap:balance}
.bar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);font-family:var(--display);font-size:.62rem;font-weight:600;cursor:pointer;min-width:0}
.tool svg{width:24px;height:24px}
.tool span{white-space:nowrap}
.tool:hover{border-color:var(--ink-soft)}
.tool:active{transform:translateY(1px)}
.tool::after{content:"";position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--firefly);opacity:0;transition:opacity .6s}
.tool.done::after{opacity:.9}
.tool:focus-visible,.btn:focus-visible,.round:focus-visible,.preset:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.k{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.kc{fill:none;stroke:var(--cat-ink);stroke-linecap:round;stroke-linejoin:round}
.kd{fill:none;stroke:var(--cat-dark);stroke-linecap:round}
.kb{fill:none;stroke:var(--cat-belly);stroke-linecap:round}
.kh{fill:none;stroke:var(--hat-line);stroke-linecap:round}
.kk{fill:none;stroke:var(--hat-edge);stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.kw{fill:none;stroke:#5e4128;stroke-linecap:round}
.kp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ks{stroke:#1d1934;stroke-width:.9;stroke-linejoin:round}
.hot{cursor:pointer}
/* на телефоне :hover залипает после нажатия — подсвечиваем только при наведении мышью */
@media (hover:hover) and (pointer:fine){.hot:hover .k,.hot:hover .kk{stroke:var(--lamp)}}
.hot:focus-visible .k,.hot:focus-visible .kk{stroke:var(--lamp)}
.hot:focus-visible{outline:none}
.hint{pointer-events:none;transition:opacity .8s}
.hint circle.ring{fill:none;stroke:var(--firefly);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.hint.seen{opacity:0}
.twinkle{animation:tw 5s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.lampglow,.bulb,.moonglow{transition:opacity 1.2s}

/* панель занятия */
.veil{position:fixed;inset:0;background:rgba(8,6,18,.62);opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);max-height:92vh;max-height:calc(100dvh - 10px);overflow-y:auto;overscroll-behavior:contain;padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
.sheet.on{transform:none}
.card{max-width:520px;margin:0 auto;background:var(--panel);border:1.5px solid var(--ink-soft);border-radius:26px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:relative;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.card h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0;padding:0 36px;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.92rem;max-width:42ch}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px}
.btn{font-family:var(--display);font-size:.95rem;font-weight:700;color:var(--night);background:var(--lamp);border:0;border-radius:16px;padding:11px 22px;cursor:pointer;box-shadow:0 3px 0 #a8743a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a8743a}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-weight:600;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.status{font-family:var(--display);font-size:.8rem;color:var(--ink-soft)}

.breath{width:220px;height:220px;max-width:100%;display:grid;place-items:center}
.orb{width:150px;height:150px;transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out}
.orb svg{width:100%;height:100%;overflow:visible}
.cl{transition-property:transform;transition-timing-function:ease-in-out}
.breath-word{font-family:var(--display);font-weight:700;font-size:1.3rem;min-height:1.4em}

.catbox{width:100%;max-width:260px;touch-action:none;position:relative;cursor:grab}
.catbox svg{width:100%;height:auto;display:block}
.eye-shut{opacity:0;transition:opacity .8s}
.eye-open{transition:opacity .8s}
.sleepy .eye-open{opacity:0}
.sleepy .eye-shut{opacity:1}
.tail{transform-origin:150px 222px}
.catbox .tail{animation:tail 5s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(-7deg)}}
.hat{transform-origin:100px 92px}
.twitch .hat{animation:tilt .45s ease}
@keyframes tilt{40%{transform:rotate(-5deg)}}
.catbox .body{transform-origin:100px 228px;animation:catb 4.5s ease-in-out infinite}
.paw{transform-box:fill-box;transform-origin:50% 100%}
@keyframes catb{50%{transform:scale(1.01,1.02)}}
.zz{font-family:var(--display);font-weight:700;fill:var(--ink);opacity:0}
.catSleep .zz{animation:zz 4.2s ease-out infinite}
.catSleep .zz:nth-child(2){animation-delay:1.4s}
.catSleep .zz:nth-child(3){animation-delay:2.8s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:.85}100%{opacity:0;transform:translate(-8px,-20px)}}
#sceneCat .hat{transform-box:fill-box;transform-origin:30% 95%;transition:transform 1.2s ease}
#sceneCat.catSleep .hat{transform:rotate(-9deg)}
.floaty{position:absolute;left:0;top:0;color:#f7d7b1;text-shadow:0 0 4px rgba(255,226,190,.95),0 0 12px rgba(240,180,120,.75),0 0 22px rgba(229,170,123,.45);filter:drop-shadow(0 0 5px rgba(246,200,150,.55));will-change:transform,opacity;pointer-events:none;line-height:1;animation:floatyPop 1.6s ease-out forwards}
@keyframes floatyPop{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}25%{opacity:.95;transform:translate(-50%,-70%) scale(1.15)}80%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--drift)),-100px) scale(.83)}}
.purr{position:absolute;font-family:var(--display);font-weight:700;color:var(--cat-belly);font-size:.95rem;pointer-events:none;animation:float 2.2s ease-out forwards}
@keyframes float{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}

.plantbox{width:190px;max-width:100%}
.drop{fill:#7fa8d8;animation:drop .9s ease-in forwards}
@keyframes drop{from{transform:translateY(-30px);opacity:1}to{transform:translateY(30px);opacity:0}}
.bloom{animation:bloom .8s ease-out}
@keyframes bloom{from{opacity:0}}

.floorbox{width:100%;max-width:360px}
.floorbox svg{width:100%;height:auto;display:block}
.foldbox{width:100%;display:flex;justify-content:center;margin:-4px 0}
#foldSvg{width:auto;max-width:100%;height:min(218px,25.2dvh);touch-action:none;cursor:grab;overflow:visible;outline:none}
#foldSvg:focus-visible{outline:2px solid var(--lamp);outline-offset:4px;border-radius:12px}
#gWrap{transform-box:view-box}
.fline{fill:none;stroke:var(--firefly);stroke-width:1.2;stroke-dasharray:4 4;opacity:.8}
.farrow path{fill:none;stroke:var(--firefly);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.farrow{animation:nudge 1.4s ease-in-out infinite}
.aR{--dx:8px;--dy:0px}.aL{--dx:-8px;--dy:0px}.aU{--dx:0px;--dy:-8px}
@keyframes nudge{50%{transform:translate(var(--dx),var(--dy))}}
#gHint{transition:opacity .3s;pointer-events:none}
.fdots{display:flex;gap:6px;justify-content:center;min-height:8px}
.fdots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink-soft)}
.fdots i.cur{border-color:var(--firefly)}
.fdots i.on{background:var(--firefly);border-color:var(--firefly)}
.fstack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;min-height:44px;width:150px;margin:0 auto;padding-bottom:3px;position:relative} /* место под всю стопку сразу — окно не растёт */
/* полочка: стопка ложится на неё и растёт вверх, пустое место читается как «сюда сложится» */
.fstack::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--line)}
.fstack svg{height:auto;display:block}
.cg:hover .k{stroke:var(--lamp)}
.fold-in{animation:land .45s ease-out}
@keyframes land{from{transform:translateY(-10px);opacity:0}}

.jarbox{position:relative;width:100%;max-width:240px}
.jarbox svg{width:100%;height:auto;display:block;overflow:visible}
.jarbox{cursor:pointer}
#catLine,#plantLine,#lLine{min-height:calc(3 * 1.5em);line-height:1.5;display:flex;align-items:center;justify-content:center;text-wrap:balance}
/* в стирке все фразы в одну строку — над вещью без лишней пустоты */
#lLine{min-height:1.5em}
#bcount{min-height:calc(3 * 1.5em);line-height:1.5;display:flex;align-items:center;justify-content:center;text-wrap:balance}
#bw{white-space:nowrap}
#jStat{min-height:calc(2 * 1.45em);line-height:1.45;display:flex;align-items:center;justify-content:center;width:100%;max-width:min(100%,44ch);padding:0 6px;box-sizing:border-box;text-align:center}
.jarbox svg{width:auto;max-width:100%;height:min(280px,22dvh);margin:0 auto}
.catbox svg{width:auto!important;max-width:100%;height:min(300px,34dvh)!important;margin:0 auto}
.jarwob{transform-box:fill-box;transform-origin:50% 100%}
#jarbox{transform-origin:50% 96%;will-change:transform}
.shaking{animation:jshake .7s ease-in-out}
@keyframes jshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
.jarform{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-height:300px;overflow:hidden;transition:max-height .7s ease,opacity .5s}
.jarform{transition:opacity .5s}
.jarform.gone{opacity:0;pointer-events:none}
.shimmer>path.ks{animation:shim 1.1s linear infinite}
.halo{fill:#f6e3a1;opacity:.4;animation:halo 1.3s ease-in-out infinite}
/* улетающие звёзды — отдельные слои поверх банки, их двигает сам браузер */
.flystar{position:fixed;left:0;top:0;pointer-events:none;will-change:transform,opacity;z-index:60}
/* звёзды улетают: окно банки опускается, комнату видно */
.sheet.relDown{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
body.relSky .veil.on{opacity:.25;transition:opacity .9s}
.flystar svg{position:relative;width:100%;height:100%;display:block;overflow:visible}
.stardust{position:fixed;left:0;top:0;width:2.4px;height:2.4px;margin:-1.2px;border-radius:50%;background:currentColor;pointer-events:none;z-index:60;will-change:transform,opacity;filter:drop-shadow(0 0 2px rgba(255,240,200,.9))}
.flycloud{position:fixed;left:0;top:0;pointer-events:none;z-index:59;will-change:transform,opacity}
.flycloud svg{width:100%;height:100%;display:block;overflow:visible}
.flystar::before{content:'';position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(246,227,161,.75) 0,rgba(246,227,161,.25) 35%,rgba(246,227,161,0) 70%)}
@keyframes halo{50%{opacity:.1}}
@keyframes shim{0%{fill:#f6e3a1}25%{fill:#e6a9c0}50%{fill:#a9c4ea}75%{fill:#c9b3ee}100%{fill:#f6e3a1}}
.btn.small{font-size:.85rem;padding:7px 16px}
.mhint{font-size:.75rem;color:var(--ink-soft);margin-top:-4px}
#jarform .presets{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;justify-content:safe center;max-width:100%;scrollbar-width:none;padding:2px 0;margin:8px 0}
#jarform .presets::-webkit-scrollbar{display:none}
#jarform .preset{flex:none}
#jarform .thought-in{min-height:0;height:calc(2 * 1.35em + 20px);line-height:1.35;padding:10px 14px;font-size:16px;overflow-y:auto}
/* набор текста на телефоне: прячем лишнее, чтобы окно помещалось над клавиатурой */
#jStat{flex-direction:column}
#jStat .mhint{margin:0;line-height:1.35}
#jarform{padding:4px 4px 2px;box-sizing:border-box}
.slip{position:absolute;top:3%;left:50%;width:min(78%,220px);height:32px;transform:translateX(-50%);perspective:700px;pointer-events:none;animation:slipIn .2s ease-out,slipOut .34s var(--outAt,.8s) ease-in forwards}
@keyframes slipIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
@keyframes slipOut{to{opacity:0;transform:translateX(-50%) scale(.2) rotate(var(--tw,160deg))}}
.slip .grp{position:absolute;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.slip .q{position:absolute;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.slip .face{position:absolute;inset:-.6px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--c)}
.slip .back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 76%,#2a2147)}
.slip .backx{transform:rotateX(180deg);background:color-mix(in srgb,var(--c) 76%,#2a2147)}

/* окно «установить на экран Домой» */
.inst{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin:2px 0 4px}
.inst .st{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px}

@keyframes instP{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.35;transform:scale(1.18)}}

/* ---------- время суток: рассвет, день, закат (ночь — основная палитра) ---------- */
:root{--sky1:#0c1530;--sky2:#0c1530;--sky3:#0c1530;--sun:#ffe7a1;--mbg:#241f42}
html:not([data-theme=night]){--mbg:var(--line)}
html[data-theme=dawn]{color-scheme:light;--night:#efe6f4;--wall:#ebe1f1;--wall-l:#e3d7ec;--floor:#dacde7;--rug:#cbbde1;--curtain:#cdbde9;--headboard:#c6b6e4;--table:#c2b1de;--blanket:#b9a8de;--blanket2:#cabbea;--pillow:#f3ecfa;--ink:#6d6492;--ink-soft:#9a90bd;--panel:#f6f0fa;--text:#4b4470;--muted:#857ba8;--line:#d4c8e8;--firefly:#f4b97c;--blossom:#e9a3bd;--sky:#9fb1e6;--sky1:#9fb1e6;--sky2:#f3c6d6;--sky3:#ffe0bd;--sun:#ffd3a4}
html[data-theme=day]{color-scheme:light;--night:#f8f0e3;--wall:#faf1e3;--wall-l:#f3e6d3;--floor:#ecdac3;--rug:#f2cfae;--curtain:#f6deb4;--headboard:#ebcdb2;--table:#dfc09d;--blanket:#f3c7a3;--blanket2:#f8d9bd;--pillow:#fffaf1;--ink:#7d6b5d;--ink-soft:#b09d8c;--panel:#fdf7ec;--text:#5c4a3f;--muted:#9a8676;--line:#ecdcc4;--firefly:#f2b65e;--blossom:#efa0b4;--sky:#b7d6ec;--sky1:#b7d6ec;--sky2:#f4e6d2;--sky3:#fde4c4;--sun:#ffe7a1}
html[data-theme=sunset]{color-scheme:light;--night:#f6e4dc;--wall:#f7e3d9;--wall-l:#f0d8cd;--floor:#e8cbbf;--rug:#e2bab6;--curtain:#eab9bf;--headboard:#dcb4c9;--table:#dbb5a2;--blanket:#d8a9c3;--blanket2:#e7bed3;--pillow:#fcefe9;--ink:#7b5f74;--ink-soft:#ae94a7;--panel:#fbf0ea;--text:#5a4256;--muted:#9a7f93;--line:#ead0c6;--firefly:#f7b46c;--blossom:#e695b4;--sky:#b9a2df;--sky1:#b9a2df;--sky2:#f2a5b6;--sky3:#ffcb92;--sun:#ffb27c}
html[data-theme=night] #dayClouds{display:none}
#dayClouds .dcd{animation:dcd 11s ease-in-out infinite alternate}
@keyframes dcd{from{transform:translateX(-4px)}to{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){#dayClouds .dcd{animation:none}}
.sunG{display:none}
html[data-theme=dawn] .sun-dawn,html[data-theme=day] .sun-day,html[data-theme=sunset] .sun-sunset{display:inline}
html:not([data-theme=night]) .moonG,html:not([data-theme=night]) #moonGlow{display:none}
html[data-theme=day] #scene .twinkle{animation:none;opacity:0}
html[data-theme=dawn] #scene .twinkle,html[data-theme=sunset] #scene .twinkle{animation:none;opacity:.35}
html[data-theme=day] #glowC{opacity:0!important}
html[data-theme=day] #bulb{opacity:0!important}
html[data-theme=dawn] #glowC{opacity:0!important}
html[data-theme=dawn] #bulb{opacity:0!important}
html[data-theme=dawn] [data-act=lamp],html[data-theme=day] [data-act=lamp]{pointer-events:none}
html[data-theme=dawn] [data-hint=lamp],html[data-theme=day] [data-hint=lamp]{display:none}
html:not([data-theme=night]) .caption{background:color-mix(in srgb,var(--panel) 88%,transparent)}
html:not([data-theme=night]) .inst .home i{background:var(--line)}
/* отдых днём: тот же экран, что ночью, но в тёплой полутени */
:root{--sunfill:#f2b65e;--sunring:#e0a24c}
/* отдых днём: задёрнутые шторы, сквозь ткань тепло просвечивает солнце */
.night.rest{background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.05) 3px 9px,transparent 9px 46px),radial-gradient(ellipse 85% 60% at 50% 36%,#f6dcc0 0,#e9c3a6 38%,#c99a86 72%,#a77c70 100%)}

/* рассвет: сиреневые шторы, сквозь них розовеет восходящее солнце */

html[data-theme=dawn] .night.rest p{color:#4f416e}html[data-theme=dawn] .night.rest .soft{color:#6b5c8e}html[data-theme=dawn] .night.rest .nphase{color:#453866}

html[data-theme=dawn]{--sunfill:#f7b88e;--sunring:#e59a78}
/* закат: шторы задёрнуты, за ними догорает закат и всходит луна */
.night.eve{background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.05) 3px 9px,transparent 9px 46px),radial-gradient(ellipse 90% 65% at 50% 34%,#efb8a6 0,#c88a9d 34%,#7d5681 68%,#3d2b55 100%)}

/* настройки */
.sets{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;text-align:left}

.dial .tm{font:700 26px var(--display);fill:var(--text);text-anchor:middle}

.tglrow{display:flex;align-items:center;justify-content:space-between;width:100%;font:inherit;font-size:.95rem;color:var(--text);background:none;border:0;padding:8px 4px;cursor:pointer;text-align:left}
.tgl{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .25s;flex:none}

.tgl.on{background:var(--lamp)}.tgl.on b{transform:translateX(18px)}
.tglrow:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:10px}
.shint{font-size:.78rem;color:var(--muted);margin:2px 4px 0;line-height:1.4}
.segc{display:flex;background:color-mix(in srgb,var(--text) 7%,transparent);border-radius:999px;padding:3px;gap:2px}
.segc button{flex:1;font:inherit;font-size:.86rem;padding:8px 6px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.segc button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.segc button:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.srow{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-size:.95rem;color:var(--text);background:none;border:0;padding:12px 10px;cursor:pointer;text-align:left;border-radius:14px}
.srow+.srow{border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.srow svg{width:22px;height:22px;flex:none;color:var(--muted)}
.srow span{flex:1}.srow .chev{width:18px;height:18px}
.srow:focus-visible{outline:2px solid var(--lamp);outline-offset:-2px}
.alist{display:flex;flex-direction:column;gap:6px;width:100%;max-width:380px}
.arow{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--text);background:var(--wall);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;text-align:left}
.arow:hover{border-color:var(--ink-soft)}
.arow:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.arow svg{width:24px;height:24px;flex:none;color:var(--ink)}
.arow b{display:block;font-family:var(--display);font-weight:700;font-size:.92rem}
.arow small{display:block;color:var(--muted);font-size:.8rem}
.arow .tx{flex:1;min-width:0}
.arow .dn{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.arow .dn.on{background:var(--firefly);border-color:var(--firefly)}
.ob{position:fixed;inset:0;z-index:50}
.showHints .hint.seen{opacity:1}
.obDots .hint circle.ring{animation-duration:1.5s;stroke-width:2.2}
.ob-mark{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#f6e3a1;box-shadow:0 0 10px 3px rgba(246,227,161,.75);pointer-events:none}
.ob-mark::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #f6e3a1;animation:markPing 1.5s ease-out infinite}

.hglow{opacity:0;transition:opacity .4s}

@keyframes hpulse{50%{opacity:.35}}
.ob-demo{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--firefly);box-shadow:0 0 0 3px rgba(246,227,161,.25),0 0 12px rgba(246,227,161,.8);margin-right:8px;vertical-align:-1px;animation:obPing 1.5s ease-out infinite}
@keyframes obPing{0%{box-shadow:0 0 0 0 rgba(246,227,161,.6),0 0 12px rgba(246,227,161,.8)}100%{box-shadow:0 0 0 12px rgba(246,227,161,0),0 0 12px rgba(246,227,161,.8)}}
.ob-hole.round{border-radius:50%}
.ob-hole{position:fixed;left:50%;top:40%;width:0;height:0;border-radius:22px;box-shadow:0 0 0 200vmax rgba(8,6,18,.74);outline:2px solid rgba(246,227,161,.55);outline-offset:3px;transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),width .5s cubic-bezier(.4,0,.2,1),height .5s cubic-bezier(.4,0,.2,1),outline-color .3s;pointer-events:none}
.ob-hole.none{outline-color:transparent}
.ob-card{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),380px);background:var(--panel);border:1.5px solid var(--ink-soft);border-radius:22px;padding:16px 16px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;transition:top .45s ease,bottom .45s ease,opacity .3s}
.ob-card p{margin:0;font-size:.98rem;line-height:1.5;color:var(--text);min-height:3em;text-wrap:balance}

.ob-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}

.bgb i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink-soft)}

.linkbtn{font:inherit;font-size:.85rem;color:var(--muted);background:none;border:0;padding:6px 10px;cursor:pointer;border-radius:10px}
.linkbtn:hover{color:var(--text)}

.sw:focus-visible,.pt:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

}

  function isIOS(){var u=navigator.userAgent;return /iP(hone|ad|od)/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)}
  function isAndroid(){return /Android/i.test(navigator.userAgent)}
  function canInstall(){return !isStandalone()&&(isIOS()||isAndroid()||!!instPrompt)}
  function iconSrc(){var l=document.querySelector('link[rel="apple-touch-icon"]');return l?l.href:''}
  var SV_SHARE='<svg viewBox="0 0 78 52"><rect x="3" y="14" width="72" height="24" rx="12" fill="#221d3a" stroke="#3a3458"/><path d="M14 26 l-4 0 M12 23 l-3 3 3 3" stroke="#6f6893" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 23 l3 3 -3 3" stroke="#6f6893" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="pulse" cx="39" cy="26" r="10" fill="none" stroke="var(--lamp)" stroke-width="1.6"/><path d="M35.5 25 v6 h7 v-6 M39 21 v8 M36.5 23.2 l2.5 -2.5 2.5 2.5" stroke="#e9e1c4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 22 h7 v8 h-7 z M55.5 22 v8" stroke="#6f6893" stroke-width="1.4" fill="none"/><rect x="63" y="22" width="7" height="8" rx="1.5" stroke="#6f6893" stroke-width="1.4" fill="none"/></svg>';
  var SV_ADD='<svg viewBox="0 0 78 52"><rect x="3" y="4" width="72" height="44" rx="9" fill="#221d3a" stroke="#3a3458"/><rect x="9" y="10" width="40" height="5" rx="2.5" fill="#3a3458"/><rect class="pulse" x="6" y="20" width="66" height="14" rx="5" fill="none" stroke="var(--lamp)" stroke-width="1.4"/><rect x="9" y="23.5" width="36" height="7" rx="3.5" fill="#6f6893"/><rect x="58" y="22" width="10" height="10" rx="2.5" fill="none" stroke="#e9e1c4" stroke-width="1.4"/><path d="M63 24.5 v5 M60.5 27 h5" stroke="#e9e1c4" stroke-width="1.4" stroke-linecap="round"/><rect x="9" y="39" width="30" height="5" rx="2.5" fill="#3a3458"/></svg>';
  function actInstall(){
    store.set('instSeen',1);
    var ic=iconSrc(),home='<div class="home"><i></i><i></i><i></i><i></i>'+(ic?'<img src="'+ic+'" alt="">':'<i></i>')+'<i></i></div>',body;
    if(isIOS()){body='<div class="inst"><div class="st">'+SV_SHARE+'<span><b>1</b>'+T('instIos1')+'</span></div><div class="st">'+SV_ADD+'<span><b>2</b>'+T('instIos2')+'</span></div><div class="st">'+home+'<span><b>3</b>'+T('instIos3')+'</span></div></div>'}
    else if(instPrompt){body='<div class="inst"><div class="st">'+home+'<span>'+T('instAnd')+'</span></div></div><div class="row"><button class="btn" id="instGo">'+T('instBtn')+'</button></div>'}
    else{body='<div class="inst"><div class="st">'+home+'<span>'+T('instAndMenu')+'</span></div></div>'}
    openSheet('<h2 id="sheetTitle">'+T('instTitle')+'</h2><p>'+T('instIntro')+'</p>'+body+'<button class="btn ghost" id="instOk">'+T('instOk')+'</button>',function(){
      var g=$('#instGo');if(g)g.addEventListener('click',function(){var pr=instPrompt;instPrompt=null;closeSheet();if(pr){try{pr.prompt()}catch(e){}}});
      $('#instOk').addEventListener('click',closeSheet);
    },true);
  }
  function maybeInstall(force){if(canInstall()&&(force||!store.get('instSeen',0)))setTimeout(function(){if(!$('#sheet').classList.contains('on')&&$('#ob').hidden)actInstall()},900)}
  function obClose(){$('#ob').hidden=true;store.set('onboarded',1);var fh=obFromHelp;obFromHelp=false;maybeInstall(fh);$('#scene').classList.remove('showHints');document.body.classList.remove('obDots')}
  $('#obNext').addEventListener('click',function(){if(obI<OB.length-1){obI++;obShow()}else obClose()});
  $('#obSkip').addEventListener('click',obClose);
  $('#setBtn').addEventListener('click',actSettings);
  addEventListener('resize',function(){if(!$('#ob').hidden)obPlace()});
  document.addEventListener('keydown',function(e){if(!$('#ob').hidden&&e.key==='Escape')obClose()});

  /* ---------- язык ---------- */
  applyLang();$('#whisper').textContent=T('whispers')[0];
  if(!store.get('onboarded',0))setTimeout(obOpen,700);
  function setLang(l){if(l===L||LANGS.indexOf(l)<0)return;L=l;store.set('lang',L);applyLang();updLight();if(!$('#ob').hidden)obShow();wi=0;say(T('whispers')[0])}
  /* ---------- настройки: время суток, язык, знакомство, установка ---------- */
  var LNAME={ru:'Русский',en:'English',uk:'Українська'};
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function clockSVG(){
    var cx=110,cy=110,R1=92,R0=62,now=new Date(),hN=now.getHours()+now.getMinutes()/60,sel=themePref==='auto'?clockPhase():themePref;
    var segs=[['night',20,29],['dawn',5,8],['day',8,17],['sunset',17,20]],col={night:'#2f285a',dawn:'#ecc8e0',day:'#f7dcae',sunset:'#f3aea6'};
    function an(h){return h/24*2*Math.PI+Math.PI/2}
    function pt(h,rr){var a=an(h);return f(cx+Math.cos(a)*rr)+' '+f(cy+Math.sin(a)*rr)}
    function arc(h1,h2,a,b){return 'M'+pt(h1,a)+' A'+a+' '+a+' 0 '+(h2-h1>12?1:0)+' 1 '+pt(h2,a)+' L'+pt(h2,b)+' A'+b+' '+b+' 0 '+(h2-h1>12?1:0)+' 0 '+pt(h1,b)+' Z'}
    function ic(k,x,y){var c=k==='night'?'#efe7c8':'#8a5a2b';
      if(k==='night')return '<circle cx="'+x+'" cy="'+y+'" r="6" fill="'+c+'"/><circle cx="'+(x+3)+'" cy="'+(y-2.4)+'" r="5.2" fill="'+col.night+'"/>';
      if(k==='day'){var s='<circle cx="'+x+'" cy="'+y+'" r="4.6" fill="'+c+'"/>';for(var i=0;i<8;i++){var a=i*Math.PI/4;s+='<line x1="'+f(x+Math.cos(a)*7)+'" y1="'+f(y+Math.sin(a)*7)+'" x2="'+f(x+Math.cos(a)*9.6)+'" y2="'+f(y+Math.sin(a)*9.6)+'" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/>'}return s}
      return '<path d="M'+(x-6)+' '+(y+2.5)+' A6 6 0 0 1 '+(x+6)+' '+(y+2.5)+' Z" fill="'+c+'"/><line x1="'+(x-9)+'" y1="'+(y+2.5)+'" x2="'+(x+9)+'" y2="'+(y+2.5)+'" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/>'+'<path d="M'+x+' '+(y-6)+' v-2.6 M'+(x-5.4)+' '+(y-3.6)+' l-1.8 -1.8 M'+(x+5.4)+' '+(y-3.6)+' l1.8 -1.8" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" fill="none"/>'}
    var s='<svg viewBox="0 0 220 220" class="dial" role="radiogroup">';
    segs.forEach(function(g){var on=g[0]===sel,mid=(g[1]+g[2])/2,a=an(mid),ix=f(cx+Math.cos(a)*(R0+R1)/2),iy=f(cy+Math.sin(a)*(R0+R1)/2);
      s+='<g class="seg'+(on?' on':'')+'" data-th="'+g[0]+'" role="radio" aria-checked="'+on+'" tabindex="0" aria-label="'+T('th'+cap(g[0]))+'"><path d="'+arc(g[1],g[2],R1,R0)+'" fill="'+col[g[0]]+'"/>'+ic(g[0],+ix,+iy)+'</g>'});
    [0,6,12,18].forEach(function(h){s+='<text x="'+pt(h,R0-12).split(' ')[0]+'" y="'+(+pt(h,R0-12).split(' ')[1]+4)+'" class="hr">'+h+'</text>'});
    var hp=pt(hN,R1+9).split(' ');s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+pt(hN,R0-4).split(' ')[0]+'" y2="'+pt(hN,R0-4).split(' ')[1]+'" class="hand"/><circle cx="'+cx+'" cy="'+cy+'" r="3" class="hub"/><circle cx="'+hp[0]+'" cy="'+hp[1]+'" r="5" class="now"/>';
    s+='<text x="'+cx+'" y="'+(cy-16)+'" class="tm" id="dialTime">'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'</text><text x="'+cx+'" y="'+(cy+30)+'" class="ph">'+T('th'+cap(sel))+'</text>';
    return s+'</svg>'}
  function actSettings(){
    var auto=themePref==='auto';
    var lg=LANGS.map(function(l){return '<button class="'+(L===l?'on':'')+'" data-lang="'+l+'" role="radio" aria-checked="'+(L===l)+'">'+LNAME[l]+'</button>'}).join('');
    var IC_Q='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.6" r=".8" fill="currentColor" stroke="none"/></svg>',
        IC_H='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M12 8v6M9 11h6"/></svg>',
        CH='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    openSheet('<h2 id="sheetTitle">'+T('setTitle')+'</h2><div class="sets">'+
      '<section class="sbox"><div class="slbl">'+T('setTheme')+'</div>'+clockSVG()+
        '<button class="tglrow" id="setAuto" role="switch" aria-checked="'+auto+'"><span>'+T('setAuto')+'</span><i class="tgl'+(auto?' on':'')+'"><b></b></i></button>'+
        '<div class="shint">'+T(auto?'setPickAuto':'setPick')+'</div></section>'+
      '<section class="sbox"><div class="slbl">'+T('setLang')+'</div><div class="segc" role="radiogroup">'+lg+'</div></section>'+
      '<section class="sbox rows"><button class="srow" id="setHelp">'+IC_Q+'<span>'+T('obHelp')+'</span>'+CH+'</button>'+(canInstall()?'<button class="srow" id="setInst">'+IC_H+'<span>'+T('setInstall')+'</span>'+CH+'</button>':'')+'</section></div>',function(){
      function pick(k){themePref=k;store.set('theme',k);setTheme(k==='auto'?clockPhase():k);actSettings()}
      [].forEach.call(document.querySelectorAll('.dial .seg'),function(g){g.addEventListener('click',function(){pick(g.dataset.th)});g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(g.dataset.th)}})});
      $('#setAuto').addEventListener('click',function(){pick(themePref==='auto'?THEME:'auto')});
      [].forEach.call(document.querySelectorAll('.segc [data-lang]'),function(b){b.addEventListener('click',function(){setLang(b.dataset.lang);actSettings()})});
      $('#setHelp').addEventListener('click',function(){obFromHelp=true;obOpen()});
      var si=$('#setInst');if(si)si.addEventListener('click',actInstall);
      var tick=setInterval(function(){var e=$('#dialTime');if(!e)return;var d=new Date();e.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')},15000);
      return function(){clearInterval(tick)};
    });
  }

  /* ---------- привязка ---------- */
  var map={painting:actPainting,cat:catTap,breath:actBreath,curtain:actCurtain,plant:actPlant,laundry:actLaundry,thoughts:actThoughts,lamp:actLamp};
  /* при повороте телефона или смене размера комната перестраивается под новую высоту */
  function rebuild(){buildScene();drawBigArt();drawVase();drawJar();drawLaundry();drawCurtain(curtainT);drawSky();drawClouds();setSceneSleep(catAsleep);applyLang();applySeen();bindActs($('#scene'));themeFix();if(!$('#ob').hidden)obPlace()}
  /* днём тёмные заливки в комнате (потолок, книги, тени) смешиваем с цветом стены; ночью возвращаем как было */
  function themeFix(){var sv=$('#scene');if(!sv)return;var day=THEME!=='night',W=null;
    if(day){var m=/^#([0-9a-f]{6})$/i.exec(getComputedStyle(document.documentElement).getPropertyValue('--wall').trim());W=m?[0,2,4].map(function(i){return parseInt(m[1].substr(i,2),16)}):[250,241,227]}
    sv.querySelectorAll('[fill]').forEach(function(el){if(el.closest('#sceneCat')||el.closest('#bigArt')||el.closest('.hint')||el.closest('.js')||el.closest('[data-gal]'))return;
      var of=el.getAttribute('data-of');if(!day){if(of){el.setAttribute('fill',of);el.removeAttribute('data-of')}return}
      var c=of||el.getAttribute('fill'),mm=/^#([0-9a-f]{6})$/i.exec(c);if(!mm)return;var v=[0,2,4].map(function(i){return parseInt(mm[1].substr(i,2),16)});
      if((.3*v[0]+.59*v[1]+.11*v[2])/255>=.3)return;if(!of)el.setAttribute('data-of',c);el.setAttribute('fill','rgb('+v.map(function(x,i){return Math.round(x*.28+W[i]*.72)}).join(',')+')')})}
  function setTheme(th){if(th===THEME)return;THEME=th;document.documentElement.setAttribute('data-theme',th);npMeta();ART=th==='night'?ART_N:ART_D;
    var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--night').trim());
    rebuild();updLight()}
  setInterval(function(){if(themePref==='auto'&&!lightsOut)setTheme(clockPhase())},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&themePref==='auto'&&!lightsOut)setTheme(clockPhase())});
  var bootT=Date.now(),rsT=null;
  addEventListener('resize',function(){var spl=$('#splash');if(spl&&!spl.classList.contains('out'))return;var early=Date.now()-bootT<3000;clearTimeout(rsT);rsT=setTimeout(function(){var d=Math.abs(calcSE()-SE);if(early?d===0:d<24)return;rebuild()},early?40:200)});
  function bindActs(root){root.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click',function(){if(lightsOut)return;seeHint(el.dataset.act);map[el.dataset.act]()});
    el.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&el.tagName!=='BUTTON'){e.preventDefault();if(lightsOut)return;map[el.dataset.act]()}});
  })}
  bindActs(document);applySeen();
  /* запуск: ждём, пока размер экрана перестанет меняться, перестраиваем комнату и только потом показываем */
  /* тучки на заставке: одно непрерывное движение — ровный дрейф, потом плавный разгон в ту же сторону */
  /* тучки на заставке двигает сам браузер (Web Animations), поэтому перестройка комнаты их не тормозит:
     ровный дрейф, потом плавный разгон в ту же сторону с той же начальной скоростью */
  var splStart=null;(function(){var sp=$('#splash');if(!sp)return;var still=false;try{still=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
    var V=3.2,A=34,DRIFT=20,cs=[[sp.querySelector('.spc1'),-1],[sp.querySelector('.spc2'),1]],drifts=[];
    function tf(dir,x){return 'translate3d('+(dir*(x-4)).toFixed(2)+'%,0,0)'}
    cs.forEach(function(c){if(!c[0]||!c[0].animate)return;drifts.push(still?null:c[0].animate([{transform:tf(c[1],0)},{transform:tf(c[1],V*DRIFT)}],{duration:DRIFT*1000,easing:'linear',fill:'forwards'}))});
    splStart=function(){var T=.45,DUR=2.2,N=26;cs.forEach(function(c,i){if(!c[0]||!c[0].animate)return;var d=drifts[i],t=d&&d.currentTime!=null?d.currentTime/1000+.016:0,x0=still?0:V*t,kf=[];
        for(var k=0;k<=N;k++){var u=DUR*k/N,x=still?0:x0+V*u+(u<T?A*u*u*u/(6*T):A*(T*T/6+T*(u-T)/2+(u-T)*(u-T)/2)),o=Math.max(0,1-Math.max(0,u-.5)/1.2);kf.push({transform:tf(c[1],x),opacity:o,offset:k/N})}
        c[0].animate(kf,{duration:DUR*1000,easing:'linear',fill:'forwards'});if(d)d.cancel()})}})();
  (function(){var last=null,first=null,stable=0,t0=Date.now(),st=$('.stage');var sx=$('#splash .sptx');if(sx)sx.textContent=T('title');
    function key(){return calcSE()+'|'+Math.round(st.getBoundingClientRect().height)+'|'+$('#whisper').offsetHeight}
    function chk(){var k=key();if(first===null)first=k;
      if(k===last)stable++;else{stable=0;last=k}
      /* перестраиваем комнату один раз — когда размер окончательно устоялся */
      if(stable>=3||Date.now()-t0>1600){if(k!==first||calcSE()!==SE)rebuild();var sp=$('#splash'),wait=Math.max(0,1100-performance.now());var built=key();setTimeout(function(){if(key()!==built||calcSE()!==SE)rebuild();st.classList.add('ready');if(sp){if(splStart)splStart();sp.classList.add('out');setTimeout(function(){sp.remove()},2600)}},wait);return}
      setTimeout(chk,80)}
    requestAnimationFrame(chk)})();
  addEventListener('pageshow',function(e){if(e.persisted&&calcSE()!==SE)rebuild()});
  if(store.get('onboarded',0))setTimeout(function(){maybeInstall(false)},3200);
  if(0)document.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click',function(){if(lightsOut)return;seeHint(el.dataset.act);map[el.dataset.act]()});
    el.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&el.tagName!=='BUTTON'){e.preventDefault();if(lightsOut)return;map[el.dataset.act]()}});
  });
})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){})})}
</script>
