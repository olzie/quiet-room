<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A tiny bedtime game: pet a sleepy cat, breathe with the moon, fold a paper star and turn off the lamp.">
<meta name="theme-color" content="#120f22">
<style>html{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#120f22}*,*::before,*::after{box-sizing:inherit}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quiet Room</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Quiet Room">
<meta property="og:title" content="Quiet Room">
<meta property="og:description" content="A tiny bedtime game: pet a sleepy cat, breathe with the moon, fold a paper star and turn off the lamp.">
<meta property="og:url" content="https://olzie.github.io/quiet-room/">
<meta property="og:image" content="https://olzie.github.io/quiet-room/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A pencil-drawn night bedroom with a ginger cat in a witch hat on the bed">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Quiet Room">
<meta name="twitter:image" content="https://olzie.github.io/quiet-room/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Игровой экран: шапка-индикатор, сцена на всю высоту, панель предметов снизу. Спальня светлым карандашом по глубокой ночи. Намеренно только тёмная тема. */
:root{
  color-scheme: dark;
  --night:#120f22;
  --wall:#1d1934;
  --wall-l:#191530;
  --floor:#16122a;
  --rug:#221c40;
  --sky:#0c1530;
  --curtain:#2b2452;
  --headboard:#2a2350;
  --table:#2d2650;
  --blanket:#3c3470;
  --blanket2:#4a4186;
  --pillow:#5a5280;
  --ink:#cfc6e6;
  --ink-soft:#8a82ad;
  --lamp:#f0b46a;
  --cat:#c9875c;
  --cat-dark:#8f5a3a;
  --cat-ink:#4a2c1c;
  --cat-belly:#e2b48f;
  --hat:#2f2860;
  --hat-line:#6a5fb0;
  --blossom:#e6a9c0;
  --firefly:#f6e3a1;
  --moon:#e9e1c4;
  --text:#e6e0f2;
  --muted:#9890b6;
  --line:#352f57;
  --panel:#1b1731;
  --display:"Comfortaa", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.08;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.game{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:8px 10px;box-sizing:border-box}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.title{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.hud-r{display:flex;align-items:center;gap:8px}
.meter{font:inherit;cursor:pointer;transition:border-color .6s,box-shadow .6s;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.meter svg{width:24px;height:24px}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);cursor:pointer;padding:0}
.round svg{width:20px;height:20px}
.lang{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.04em;color:var(--ink)}
.hud-r{position:relative}
.soundmenu{position:absolute;top:44px;right:0;z-index:30;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border:1.5px solid var(--ink-soft);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:170px}
.soundmenu button{display:flex;align-items:center;gap:10px;font:inherit;font-size:.88rem;color:var(--text);background:transparent;border:0;border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left}
.soundmenu button svg{width:20px;height:20px;flex:none;color:var(--ink-soft)}
.soundmenu button:hover{background:var(--wall)}
.soundmenu button[aria-checked="true"]{background:var(--wall);color:var(--lamp)}
.soundmenu button[aria-checked="true"] svg{color:var(--lamp)}
.soundmenu button:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.round.on{color:var(--lamp);border-color:var(--lamp)}
.meter.full{border-color:var(--firefly);animation:mglow 3.2s ease-in-out infinite}
@keyframes mglow{50%{box-shadow:0 0 14px rgba(246,227,161,.35)}}
.meter:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.round[aria-pressed="true"]{color:var(--lamp);border-color:var(--lamp)}
.stage{flex:1;min-height:0;position:relative}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.caption{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;width:100%;max-width:400px;box-sizing:border-box;text-align:center;background:rgba(18,15,34,.78);border:1.5px solid var(--line);border-radius:16px;padding:7px 14px;font-size:.85rem;color:var(--text);pointer-events:none;transition:opacity .6s;text-wrap:balance}
.bar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);color:var(--ink);font-family:var(--display);font-size:.62rem;font-weight:600;cursor:pointer;min-width:0}
.tool svg{width:24px;height:24px}
.tool span{white-space:nowrap}
.tool:hover{border-color:var(--ink-soft)}
.tool:active{transform:translateY(1px)}
.tool::after{content:"";position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--firefly);opacity:0;transition:opacity .6s}
.tool.done::after{opacity:.9}
.tool:focus-visible,.btn:focus-visible,.round:focus-visible,.preset:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.k{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.kc{fill:none;stroke:var(--cat-ink);stroke-linecap:round;stroke-linejoin:round}
.kd{fill:none;stroke:var(--cat-dark);stroke-linecap:round}
.kb{fill:none;stroke:var(--cat-belly);stroke-linecap:round}
.kh{fill:none;stroke:var(--hat-line);stroke-linecap:round}
.kw{fill:none;stroke:#5e4128;stroke-linecap:round}
.kp{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ks{stroke:#1d1934;stroke-width:.9;stroke-linejoin:round}
.hot{cursor:pointer}
.hot:hover .k,.hot:focus-visible .k{stroke:var(--lamp)}
.hot:focus-visible{outline:none}
.hint{pointer-events:none;transition:opacity .8s}
.hint circle.ring{fill:none;stroke:var(--firefly);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.hint.seen{opacity:0}
.twinkle{animation:tw 5s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.lampglow,.bulb,.moonglow{transition:opacity 1.2s}

/* панель занятия */
.veil{position:fixed;inset:0;background:rgba(8,6,18,.62);opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);max-height:92vh;max-height:calc(100dvh - 10px);overflow-y:auto;overscroll-behavior:contain;padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
.sheet.on{transform:none}
.card{max-width:520px;margin:0 auto;background:var(--panel);border:1.5px solid var(--ink-soft);border-radius:26px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:relative;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.card h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0;padding:0 36px;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.92rem;max-width:42ch}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px}
.btn{font-family:var(--display);font-size:.95rem;font-weight:700;color:var(--night);background:var(--lamp);border:0;border-radius:16px;padding:11px 22px;cursor:pointer;box-shadow:0 3px 0 #a8743a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a8743a}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-weight:600;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.status{font-family:var(--display);font-size:.8rem;color:var(--ink-soft)}

.breath{width:220px;height:220px;max-width:100%;display:grid;place-items:center}
.orb{width:150px;height:150px;transform:scale(.62);transition-property:transform;transition-timing-function:ease-in-out}
.orb svg{width:100%;height:100%;overflow:visible}
.breath-word{font-family:var(--display);font-weight:700;font-size:1.3rem;min-height:1.4em}

.catbox{width:100%;max-width:260px;touch-action:none;position:relative;cursor:grab}
.catbox svg{width:100%;height:auto;display:block}
.eye-shut{opacity:0;transition:opacity .8s}
.eye-open{transition:opacity .8s}
.sleepy .eye-open{opacity:0}
.sleepy .eye-shut{opacity:1}
.tail{transform-origin:150px 222px}
.catbox .tail{animation:tail 5s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(-7deg)}}
.hat{transform-origin:100px 92px}
.twitch .hat{animation:tilt .45s ease}
@keyframes tilt{40%{transform:rotate(-5deg)}}
.catbox .body{transform-origin:100px 228px;animation:catb 4.5s ease-in-out infinite}
@keyframes catb{50%{transform:scale(1.01,1.02)}}
.zz{font-family:var(--display);font-weight:700;fill:var(--ink);opacity:0}
.catSleep .zz{animation:zz 4.2s ease-out infinite}
.catSleep .zz:nth-child(2){animation-delay:1.4s}
.catSleep .zz:nth-child(3){animation-delay:2.8s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:.85}100%{opacity:0;transform:translate(-8px,-20px)}}
#sceneCat .hat{transform-box:fill-box;transform-origin:30% 95%;transition:transform 1.2s ease}
#sceneCat.catSleep .hat{transform:rotate(-9deg)}
#sceneCat.catSleep .body{transform-box:fill-box;transform-origin:50% 100%;animation:catb 4.5s ease-in-out infinite}
.purr{position:absolute;font-family:var(--display);font-weight:700;color:var(--cat-belly);font-size:.95rem;pointer-events:none;animation:float 2.2s ease-out forwards}
@keyframes float{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}

.plantbox{width:190px;max-width:100%}
.drop{fill:#7fa8d8;animation:drop .9s ease-in forwards}
@keyframes drop{from{transform:translateY(-30px);opacity:1}to{transform:translateY(30px);opacity:0}}
.bloom{animation:bloom .8s ease-out}
@keyframes bloom{from{opacity:0}}

.floorbox{width:100%;max-width:360px}
.floorbox svg{width:100%;height:auto;display:block}
.foldbox{width:100%;display:flex;justify-content:center}
#foldSvg{width:auto;max-width:100%;height:min(260px,30dvh);touch-action:none;cursor:grab;overflow:visible;outline:none}
#foldSvg:focus-visible{outline:2px solid var(--lamp);outline-offset:4px;border-radius:12px}
#gWrap{transform-box:view-box}
.fline{fill:none;stroke:var(--firefly);stroke-width:1.2;stroke-dasharray:4 4;opacity:.8}
.farrow path{fill:none;stroke:var(--firefly);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.farrow{animation:nudge 1.4s ease-in-out infinite}
.aR{--dx:8px;--dy:0px}.aL{--dx:-8px;--dy:0px}.aU{--dx:0px;--dy:-8px}
@keyframes nudge{50%{transform:translate(var(--dx),var(--dy))}}
#gHint{transition:opacity .3s;pointer-events:none}
.fdots{display:flex;gap:6px;justify-content:center;min-height:8px}
.fdots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink-soft)}
.fdots i.cur{border-color:var(--firefly)}
.fdots i.on{background:var(--firefly);border-color:var(--firefly)}
.fstack{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:12px}
.fstack svg{height:auto;display:block}
.cg:hover .k{stroke:var(--lamp)}
.fold-in{animation:land .45s ease-out}
@keyframes land{from{transform:translateY(-10px);opacity:0}}

.jarbox{position:relative;width:100%;max-width:240px}
.jarbox svg{width:100%;height:auto;display:block;overflow:visible}
.jarbox{cursor:pointer}
.jarbox svg{width:auto;max-width:100%;height:min(280px,22dvh);margin:0 auto}
.catbox svg{width:auto!important;max-width:100%;height:min(300px,34dvh)!important;margin:0 auto}
.jarwob{transform-box:fill-box;transform-origin:50% 100%}
.shaking{animation:jshake .7s ease-in-out}
@keyframes jshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}}
.jarform{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;max-height:300px;overflow:hidden;transition:max-height .7s ease,opacity .5s}
.jarform.gone{max-height:0;opacity:0;pointer-events:none}
.shimmer>path.ks{animation:shim 1.1s linear infinite}
.halo{fill:#f6e3a1;opacity:.4;animation:halo 1.3s ease-in-out infinite}
@keyframes halo{50%{opacity:.1}}
@keyframes shim{0%{fill:#f6e3a1}25%{fill:#e6a9c0}50%{fill:#a9c4ea}75%{fill:#c9b3ee}100%{fill:#f6e3a1}}
.btn.small{font-size:.85rem;padding:7px 16px}
.mhint{font-size:.75rem;color:var(--ink-soft);margin-top:-4px}
#jarform .presets{flex-wrap:nowrap;overflow-x:auto;justify-content:safe center;max-width:100%;scrollbar-width:none;padding-bottom:2px}
#jarform .presets::-webkit-scrollbar{display:none}
#jarform .preset{flex:none}
#jarform .thought-in{min-height:46px}
.strip{position:absolute;top:6%;left:50%;transform:translateX(-50%);max-width:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-weight:600;font-size:.8rem;color:#2a2147;padding:4px 12px;border-radius:3px;animation:fold 1.1s ease-in forwards;pointer-events:none}
@keyframes fold{0%{opacity:0;transform:translateX(-50%) scaleX(1)}15%{opacity:1}55%{transform:translateX(-50%) scaleX(1) rotate(0)}100%{opacity:0;transform:translateX(-50%) scaleX(.04) rotate(45deg)}}
.fall{transition:transform 1s cubic-bezier(.45,0,.55,1.25)}
.thought-in{width:100%;max-width:340px;font:inherit;font-size:.95rem;color:var(--text);background:var(--wall);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:none;min-height:58px;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.thought-in:focus{outline:2px solid var(--lamp);outline-offset:1px}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.preset{font:inherit;font-size:.8rem;color:var(--muted);background:transparent;border:1.5px dashed var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}

.night{position:fixed;inset:0;z-index:40;background:#06050c;opacity:0;pointer-events:none;transition:opacity 3s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.night.on{opacity:1;pointer-events:auto}
.night p{margin:0;color:#7d76a0;font-family:var(--display);font-size:1.05rem;max-width:26ch;line-height:1.4}
.night .soft{font-size:.82rem;color:#4f4a6c;font-family:var(--body)}
.night .btn.ghost{color:#4f4a6c;border-color:#221f38}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#bfb8e0;animation:tw 6s ease-in-out infinite}
.slow-dot{width:10px;height:10px;border-radius:50%;background:#3a3460;animation:sd 10s ease-in-out infinite}
@keyframes sd{0%,100%{transform:scale(1);opacity:.5}40%{transform:scale(2.4);opacity:.9}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}
</style>

</head>
<body>
<div class="game">
  <header class="hud">
    <div class="title" data-i18n="title">Тихая комната</div>
    <div class="hud-r" id="hudR">
      <button class="meter" id="meter" data-i18n-title="meterTitle" data-i18n-aria="meterTitle" title="Сколько света ты накопила">
        <svg viewBox="0 0 26 26" aria-hidden="true">
          <defs><clipPath id="moonClip"><rect id="moonFill" x="0" y="26" width="26" height="26"/></clipPath></defs>
          <circle cx="13" cy="13" r="10" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/>
          <circle cx="13" cy="13" r="9" fill="var(--firefly)" clip-path="url(#moonClip)" opacity=".85"/>
        </svg>
        <span id="lightText">свет</span>
      </button>
      <button class="round lang" id="langBtn" data-i18n="langShort" data-i18n-aria="langAria" aria-label="Язык: русский">RU</button>
      <button class="round" id="soundBtn" aria-haspopup="true" aria-expanded="false" data-i18n-aria="sound" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" id="soundIco"></svg></button>
      <div class="soundmenu" id="soundMenu" role="menu" hidden>
        <button role="menuitemradio" data-mode="silence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg><span data-i18n="m_silence">Тишина</span></button>
        <button role="menuitemradio" data-mode="grey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg><span data-i18n="m_grey">Серый шум</span></button>
        <button role="menuitemradio" data-mode="meditate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg><span data-i18n="m_meditate">Медитация</span></button>
      </div>
    </div>
  </header>

  <main class="stage">
    <svg id="scene" viewBox="0 0 400 560" preserveAspectRatio="xMidYMax meet" role="img" data-i18n-aria="sceneAria" aria-label="Ночная спальня, нарисованная карандашом"></svg>
    <div class="caption" id="whisper">Ты в постели, и этого достаточно. Нажми на что-нибудь в комнате.</div>
  </main>

  <nav class="bar" id="bar" data-i18n-aria="navAria" aria-label="Предметы в комнате">
    <button class="tool" data-act="cat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10 6 3.5l4 3.7h4L18 3.5l1 6.5q1.6 9-7 10Q3.4 19 5 10z"/><circle cx="9.5" cy="12" r=".9" fill="currentColor"/><circle cx="14.5" cy="12" r=".9" fill="currentColor"/></svg><span data-i18n="t_cat">Кот</span></button>
    <button class="tool" data-act="breath"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M12 3v18M5 12h14"/><path d="M15.5 6.2a1.6 1.6 0 1 0 1.3 2.4 1.3 1.3 0 0 1-1.3-2.4z" fill="currentColor"/></svg><span data-i18n="t_breath">Окно</span></button>

  function slab(x0,y,w,h,col,kind,id,k){

    return s;
  }

        starsNow().forEach(function(g){var b=baseOf(g);g.style.transition='transform .22s ease, opacity .9s';
          g.style.transform='translate('+f(b[0]+(Math.random()-.5)*7)+'px,'+f(b[1]-2-Math.random()*8)+'px)';
          setTimeout(function(){g.style.transform='translate('+f(b[0]+(Math.random()-.5)*4)+'px,'+f(b[1]-Math.random()*4)+'px)'},230);
          setTimeout(function(){g.style.transform=g.dataset.base;g.style.opacity=dim},470)});
        var SL=T('shakeLines');$('#jStat').textContent=SL[shakes%SL.length];shakes++;mark('thoughts');
        try{if(navigator.vibrate)navigator.vibrate(35)}catch(e){}
      }
      function onMotion(e){var a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;var m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);if(m>32&&Date.now()-lastShake>1200){lastShake=Date.now();shake()}}
      var motionOn=false;
      function enableMotion(){if(motionOn)return;try{if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(function(s){if(s==='granted'&&!motionOn){motionOn=true;window.addEventListener('devicemotion',onMotion)}}).catch(function(){})}else if(window.DeviceMotionEvent){motionOn=true;window.addEventListener('devicemotion',onMotion)}}catch(e){}}
      if(!(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'))enableMotion();
      function userShake(){enableMotion();shake()}
      $('#shakeBtn').addEventListener('click',userShake);
      $('#jarbox').addEventListener('click',userShake);
      $('#jarbox').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();userShake()}});

      function release(){
        if(releasing||!alive)return;releasing=true;
        $('#jarform').classList.add('gone');$('#shakeRow').classList.add('gone');
        $('#jStat').textContent=T('releaseStart');var ip=document.querySelector('#card > p');if(ip){ip.style.transition='opacity .8s';ip.style.opacity=.2}
        var st=starsNow().sort(function(a,b){return baseOf(a)[1]-baseOf(b)[1]});
        var T0=performance.now()+600,flies=st.map(function(g,i){var b=baseOf(g);g.classList.add('shimmer');g.setAttribute('filter','url(#sglow)');g.insertAdjacentHTML('afterbegin','<circle class="halo" r="7.5" style="animation-delay:'+(-Math.random()*1.3).toFixed(2)+'s"/>');var pth=g.querySelector('path.ks');if(pth)pth.style.animationDelay=(-(i*0.17)%1.1).toFixed(2)+'s';g.style.transition='none';g.style.opacity=1;
          return {g:g,x:b[0],y:b[1],tx:b[0]-50-Math.random()*60,ty:-150-Math.random()*60,start:i*70,dur:3000+Math.random()*700,ph:Math.random()*6.28,fr:1.4+Math.random()*1.4,rot:Math.random()*300}});
        function fly(now){var tt=now-T0,live=false;flies.forEach(function(fl){var q=(tt-fl.start)/fl.dur;if(q<0){live=true;return}if(q>1){fl.g.style.opacity=0;return}live=true;
          var e=1-Math.pow(1-q,2.2),dx=fl.tx-fl.x,dy=fl.ty-fl.y,L=Math.hypot(dx,dy)||1,w=Math.sin(q*fl.fr*6.283+fl.ph)*9*Math.sin(q*3.1416),x=fl.x+dx*e-dy/L*w,y=fl.y+dy*e+dx/L*w;
          fl.g.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(fl.rot*e).toFixed(0)+'deg) scale('+(1+.3*Math.sin(q*3.1416)).toFixed(2)+')';
          fl.g.style.opacity=((q<.72?1:(1-q)/.28)*(.62+.38*Math.sin(tt/170+fl.ph))).toFixed(2)});
          if(live&&alive)requestAnimationFrame(fly)}
        requestAnimationFrame(fly);
        setTimeout(function(){
          jarStars=0;store.set('stars',0);skyExtra=Math.min(40,skyExtra+8);store.set('sky',skyExtra);drawJar();drawSky();say(T('releasedSay'));
          if(!alive)return;
          $('#bigJarG').innerHTML=jarSVG(0,true);$('#jStat').textContent=T('released');
          $('#jarform').classList.remove('gone');$('#shakeRow').classList.remove('gone');releasing=false;dim=1;var ip2=document.querySelector('#card > p');if(ip2)ip2.style.opacity=1;
        },600+st.length*70+3900);
      }
      function fold(t){
        t=(t||'').trim();if(!t||busy||releasing)return;busy=true;
        var idx=jarStars,color=SC[idx%SC.length];
        var strip=document.createElement('div');strip.className='strip';strip.textContent=t;strip.style.background=color;$('#jarbox').appendChild(strip);
        $('#tin').value='';
        setTimeout(function(){
          strip.remove();
          var slot=SLOTS[Math.min(idx,SLOTS.length-1)];
          var holder=$('#bigJarG .newstars');
          holder.insertAdjacentHTML('beforeend',starG(-8,-122,idx,'fall'));
          var g=holder.lastElementChild;
          requestAnimationFrame(function(){requestAnimationFrame(function(){g.style.transform='translate('+f(slot[0])+'px,'+f(slot[1])+'px)';g.dataset.base=g.style.transform})});
          setTimeout(function(){
            jarStars=Math.min(idx+1,SLOTS.length);store.set('stars',jarStars);drawJar();mark('thoughts');busy=false;
            $('#jStat').textContent=inJar(jarStars);
            if(jarStars>=SLOTS.length)setTimeout(release,700);
          },1050);
        },1000);
      }
      $('#tgo').addEventListener('click',function(){fold($('#tin').value)});
      document.querySelectorAll('.preset').forEach(function(p){p.addEventListener('click',function(){fold(p.textContent)})});
      if(jarStars>=SLOTS.length)setTimeout(release,900);
      return function(){alive=false;if(motionOn)window.removeEventListener('devicemotion',onMotion)};
    });
  }

  /* ---------- лампа ---------- */
  function actLamp(){
    var n=Object.keys(acts).length;
    openSheet('<h2 id="sheetTitle">'+T('lampTitle')+'</h2><p>'+T(n?'lampDid':'lampNone')+'</p><div class="row"><button class="btn" id="off">'+T('off')+'</button></div>');
    $('#off').addEventListener('click',function(){closeSheet();mark('lamp');$('#glowC').style.opacity=0;$('#bulb').style.opacity=.15;setTimeout(function(){$('#night').classList.add('on');nightDim=.55;if(ctx)applyMode()},900)});
  }
  (function(){var n=$('#night');for(var i=0;i<40;i++){var s=document.createElement('span');s.className='star';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.opacity=(.2+Math.random()*.5);s.style.animationDelay=(Math.random()*6)+'s';n.appendChild(s)}})();
  $('#lightOn').addEventListener('click',function(){$('#night').classList.remove('on');$('#glowC').style.opacity=1;$('#bulb').style.opacity=.9;nightDim=1;if(ctx)applyMode()});

  $('#meter').addEventListener('click',function(){updLight();var m=Math.floor((Date.now()-started)/60000);
    say(lightP>=1?T('moonFull'):(m<1?T('justCame'):T('restFor').replace('{n}',minWord(m))))});

  /* ---------- язык ---------- */
  applyLang();$('#whisper').textContent=T('whispers')[0];
  $('#langBtn').addEventListener('click',function(){
    L=LANGS[(LANGS.indexOf(L)+1)%LANGS.length];store.set('lang',L);
    closeSheet();applyLang();wi=0;say(T('whispers')[0]);
  });

  /* ---------- привязка ---------- */
  var map={cat:catTap,breath:actBreath,curtain:actCurtain,plant:actPlant,laundry:actLaundry,thoughts:actThoughts,lamp:actLamp};
  document.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click',function(){map[el.dataset.act]()});
    el.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&el.tagName!=='BUTTON'){e.preventDefault();map[el.dataset.act]()}});
  });
})();
</script>
